{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update the details of this expense</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense_id) }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="expense-amount">
                        <span class="expense-currency" aria-hidden="true">₹</span>
                        <input type="number" id="amount" name="amount"
                               class="form-input expense-amount-input"
                               step="0.01" min="0.01" max="10000000" inputmode="decimal"
                               placeholder="0.00"
                               value="{{ form.get('amount', '') }}"
                               required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category"
                            class="form-input expense-select" required>
                        <option value="" disabled {% if not form.get('category') %}selected{% endif %}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}" {% if form.get('category') == category %}selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ form.get('date', '') }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="200"
                           placeholder="Optional — e.g. Team lunch"
                           value="{{ form.get('description', '') }}">
                </div>
                <div class="expense-actions">
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                    <button type="submit" class="btn-submit expense-submit">Save Changes</button>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
